<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment | Advanced Skin Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Flatpickr CSS for the custom date picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <!-- Flatpickr Custom Theme -->
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/airbnb.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            overflow-x: hidden;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #5c5248;
            background-color: #faf3ea;
            background-image: radial-gradient(120% 100% at 15% 0%, #f6ead9 0%, #faf3ea 55%);
            min-height: 100vh;
        }

        /* ---------- Header (matches site header) ---------- */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(250,243,234,0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #e8dcc8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 32px;
            gap: 20px;
        }
        .site-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 19px;
            font-weight: 600;
            color: #2a2118;
            text-decoration: none;
            white-space: nowrap;
            flex: 0 0 auto;
        }
        .site-header .logo img {
            height: 34px;
            width: 34px;
            object-fit: contain;
        }
        .nav-links {
            display: flex;
            gap: 22px;
            align-items: center;
            flex-wrap: nowrap;
        }
        .nav-links a {
            color: #5c5248;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }
        .nav-links a:hover {
            color: #2a2118;
        }
        .nav-links .appointment-btn {
            background-color: #2a2118;
            color: #fff !important;
            padding: 11px 24px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.2px;
        }
        .nav-links .appointment-btn:hover {
            background-color: #443626;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 26px;
            height: 19px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
        }
        .hamburger span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #2a2118;
            border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .hamburger.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        /* ---------- Page content ---------- */
        .form-content-area {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }
        .mockup-card {
            background-color: #fffdf9;
            width: 100%;
            max-width: 650px;
            padding: 48px 55px;
            border-radius: 24px;
            border: 1px solid #e8dcc8;
            box-shadow: 0 30px 60px -30px rgba(60,44,20,0.25);
        }
        .card-eyebrow {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #b98a3e;
            margin-bottom: 10px;
        }
        h2 {
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 400;
            font-size: 2.2rem;
            margin-bottom: 8px;
            text-align: center;
            color: #2a2118;
        }
        .card-subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: #5c5248;
            margin-bottom: 35px;
        }
        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .form-label {
            width: 140px;
            font-size: 16px;
            color: #2a2118;
            font-weight: 600;
            flex-shrink: 0;
        }
        .form-field-wrapper {
            flex-grow: 1;
            display: flex;
            gap: 15px;
            align-items: center;
            min-width: 0;
        }
        .input-box {
            width: 100%;
            background-color: #faf3ea;
            border: 1px solid #e8dcc8;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            color: #2a2118;
        }
        .input-box:focus {
            border-color: #b98a3e;
        }
        .input-box option:disabled {
            color: #b0b0b0;
            background-color: #f0f0f0;
        }
        .submit-btn-row {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }
        .btn-submit {
            padding: 14px 34px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 600;
            letter-spacing: 0.2px;
            cursor: pointer;
            border: none;
            border-radius: 999px;
            background-color: #2a2118;
            color: #fff;
            transition: background-color 0.3s;
        }
        .btn-submit:hover {
            background-color: #443626;
        }
        @media (max-width: 900px) {
            .nav-links { display: none; }
            .hamburger { display: flex; }
            .nav-links.open {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                width: 100%;
                gap: 0;
                position: absolute;
                top: 100%;
                left: 0;
                background: #faf3ea;
                border-bottom: 1px solid #e8dcc8;
                padding: 10px 20px 20px;
            }
            .nav-links.open a {
                padding: 12px 4px;
                border-top: 1px solid rgba(125,152,163,0.25);
                text-align: center;
                font-size: 14px;
            }
            .nav-links.open .appointment-btn { margin-top: 10px; text-align: center; }
            .site-header { position: relative; flex-wrap: wrap; }
        }
        @media (max-width: 600px) {
            html, body {
                height: 100dvh;
                overflow: hidden;
                overscroll-behavior: none;
            }
            body {
                display: flex;
                flex-direction: column;
            }
            .site-header {
                flex-wrap: wrap;
                flex-shrink: 0;
                padding: 1.6vh 4vw;
            }
            .form-row {
                flex-direction: column;
                align-items: flex-start;
                gap: clamp(3px, 0.7vh, 6px);
                margin-bottom: 0;
            }
            .form-label {
                width: auto;
                font-size: clamp(13px, 2.1vh, 15px);
                font-weight: 600;
            }
            .form-field-wrapper {
                flex-direction: column;
                align-items: stretch;
                gap: clamp(6px, 1.1vh, 10px);
                width: 100%;
            }
            .form-field-wrapper > div {
                width: 100% !important;
            }
            .input-box {
                padding: clamp(9px, 1.6vh, 12px) 12px;
                font-size: clamp(13px, 2vh, 15px);
            }
            .submit-btn-row {
                justify-content: stretch;
                margin-top: clamp(2px, 0.5vh, 4px);
            }
            .btn-submit {
                width: 100%;
                padding: clamp(11px, 2vh, 15px) 20px;
                font-size: clamp(13px, 2vh, 15px);
            }
            .form-content-area {
                flex: 1 1 auto;
                min-height: 0;
                overflow: hidden;
                padding: 1.6vh 4vw;
                display: flex;
                align-items: stretch;
                justify-content: center;
            }
            .mockup-card {
                width: 100%;
                height: 100%;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 2.4vh 6vw;
                box-shadow: none;
            }
            .card-eyebrow {
                flex-shrink: 0;
                font-size: clamp(10px, 1.8vh, 12px);
                letter-spacing: 1.5px;
                margin-bottom: clamp(4px, 0.8vh, 8px);
            }
            h2 {
                flex-shrink: 0;
                font-size: clamp(19px, 3.6vh, 25px);
                line-height: 1.15;
                margin-bottom: clamp(3px, 0.6vh, 6px);
            }
            .card-subtitle {
                flex-shrink: 0;
                font-size: clamp(11px, 1.9vh, 13px);
                margin-bottom: clamp(10px, 2vh, 18px);
            }
            #appointmentForm {
                flex: 0 1 auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: clamp(9px, 1.8vh, 16px);
            }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <a href="/" class="logo">
            <img src="/assets/images/logo.png" alt="Advanced Skin Clinic logo">
            <span>Advanced Skin Clinic</span>
        </a>
        <button class="hamburger" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/about/">About Us</a>
            <a href="/blog/">Blog</a>
            <a href="/tele-dermatology/">Tele-Dermatology</a>
            <a href="/contact/">Contact Us</a>
            <a href="/appointment.html" class="appointment-btn">Appointment</a>
        </div>
    </header>

        <div class="form-content-area">
            <div class="mockup-card">
                <div class="card-eyebrow">Advanced Skin Clinic</div>
                <h2>Schedule Your Appointment</h2>
                <p class="card-subtitle">Start protecting your skin today.</p>
                <form id="appointmentForm">
                    <div class="form-row">
                        <label for="service" class="form-label">Service</label>
                        <div class="form-field-wrapper">
                            <select id="service" class="input-box" required>
                                <option value="" disabled selected>-- Choose a Service --</option>
                                <option value="Consultation">Consultation</option>
                                <option value="Laser Hair Removal">Laser Hair Removal</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="name" class="form-label">Name</label>
                        <div class="form-field-wrapper">
                            <input type="text" id="name" class="input-box" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="phone" class="form-label">Number</label>
                        <div class="form-field-wrapper">
                            <input type="tel" id="phone" class="input-box" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="form-label">Schedule</label>
                        <div class="form-field-wrapper">
                            <!-- Wrapped in divs to ensure perfect 50/50 sizing immune to injected DOM elements -->
                            <div style="flex: 1; min-width: 0; width: 100%;">
                                <input type="text" id="date" name="date" class="input-box" placeholder="Select Date" required>
                            </div>
                            <div style="flex: 1; min-width: 0; width: 100%;">
                                <select id="time" class="input-box" required>
                                    <option value="" disabled selected>-- Select Time --</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="submit-btn-row">
                        <button type="submit" class="btn-submit">Confirm Appointment</button>
                    </div>
                </form>
            </div>
        </div>

    <script>
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        navToggle.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('open');
            navToggle.classList.toggle('active', isOpen);
            navToggle.setAttribute('aria-expanded', isOpen);
        });
    </script>

    <!-- Flatpickr JS library -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { reassignDailyTokens, countStillWaitingAhead } from "./token-utils.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDstFH1FUnW3YQVk-XUWC5rjMWuWxo5jjA",
            authDomain: "appointment-booking-1f0d0.firebaseapp.com",
            projectId: "appointment-booking-1f0d0",
            storageBucket: "appointment-booking-1f0d0.firebasestorage.app",
            messagingSenderId: "572909099522",
            appId: "1:572909099522:web:a40cb6dc7fafe8ea7e651b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const serviceInput = document.getElementById('service');
        const dateInput = document.getElementById('date');
        const timeSelect = document.getElementById('time');

        // Declared before flatpickr() below because its onReady/onChange
        // callbacks fire synchronously during init and call
        // updateAvailableTimeSlots(), which reads this variable.
        let unsubscribeSlots = null;

        // --- TIME FORMATTING HELPER ---
        function formatTo12Hour(timeStr) {
            if (!timeStr) return '';
            const parts = timeStr.split(':');
            if (parts.length < 2) return timeStr;

            let hours = parseInt(parts[0], 10);
            const minutes = parts[1];

            if (isNaN(hours)) return timeStr;

            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;

            return `${hours}:${minutes} ${ampm}`;
        }

        // --- INITIALIZE FLATPICKR (GREYS OUT SUNDAYS) ---
        flatpickr("#date", {
            minDate: "today",
            dateFormat: "Y-m-d", // Keeps standard data format matching Firebase
            altInput: true,
            altFormat: "d/m/Y", // Visual presentation
            disable: [
                function(date) {
                    // Disable Sundays (0 = Sunday)
                    return (date.getDay() === 0);
                }
            ],
            onReady: function(selectedDates, dateStr, instance) {
                // Ensure default date is valid
                let defaultDate = new Date();
                if (defaultDate.getDay() === 0) {
                    defaultDate.setDate(defaultDate.getDate() + 1); // Shift to Monday
                }
                instance.setDate(defaultDate, true);
            },
            onChange: function(selectedDates, dateStr, instance) {
                updateAvailableTimeSlots();
            }
        });

        // --- GENERATE AND SYNC SLOT CONFLICTS ---
        function generateTimeSlots(service) {
            // Laser Hair Removal uses 60-minute slots; Consultation (and anything else) uses 10-minute slots
            const interval = service === 'Laser Hair Removal' ? 60 : 10;
            const slots = [];

            function addSlotsInRange(startHour, startMin, endHour, endMin) {
                const startTotalMins = startHour * 60 + startMin;
                const endTotalMins = endHour * 60 + endMin;

                for (let m = startTotalMins; m <= endTotalMins; m += interval) {
                    const hh = String(Math.floor(m / 60)).padStart(2, '0');
                    const mins = String(m % 60).padStart(2, '0');
                    slots.push(`${hh}:${mins}`);
                }
            }

            // Morning shift: 10:00 AM to 1:30 PM (13:30)
            addSlotsInRange(10, 0, 13, 30);

            // Add a clear text divider flag for the dropdown renderer to catch
            slots.push("DIVIDER");

            // Afternoon/Evening shift: 4:30 PM (16:30) to 7:30 PM (19:30)
            addSlotsInRange(16, 30, 19, 30);

            return slots;
        }

        function updateAvailableTimeSlots() {
            if (unsubscribeSlots) unsubscribeSlots();

            const selectedService = serviceInput.value;
            // Get raw YYYY-MM-DD from Flatpickr
            const selectedDate = document.getElementById('date').value;

            if (!selectedService || !selectedDate) return;

            const timeSlots = generateTimeSlots(selectedService);

            const q = query(
                collection(db, "appointments"),
                where("service_type", "==", selectedService),
                where("appointment_date", "==", selectedDate)
            );

            unsubscribeSlots = onSnapshot(q, (snapshot) => {
                const bookedTimes = new Set();
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.appointment_time) {
                        bookedTimes.add(data.appointment_time);
                    }
                });

                const currentSelection = timeSelect.value;
                timeSelect.innerHTML = '<option value="" disabled selected>-- Select Time --</option>';

                timeSlots.forEach(slot => {
                    // Check for our custom separator
                    if (slot === "DIVIDER") {
                        const divider = document.createElement('option');
                        divider.disabled = true;
                        divider.textContent = '────── Evening ──────';
                        timeSelect.appendChild(divider);
                        return; // exit current loop cycle
                    }

                    const option = document.createElement('option');
                    option.value = slot;
                    option.textContent = formatTo12Hour(slot); // Render to user as 12hr

                    if (bookedTimes.has(slot)) {
                        option.disabled = true;
                        option.textContent += ' (Booked)';
                    }
                    timeSelect.appendChild(option);
                });

                if (currentSelection && !bookedTimes.has(currentSelection)) {
                    timeSelect.value = currentSelection;
                }
            });
        }

        serviceInput.addEventListener('change', updateAvailableTimeSlots);

        // --- HANDLE FORM SUBMISSION ---
        document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const service = serviceInput.value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const date = document.getElementById('date').value;
            const time = timeSelect.value;

            try {
                // Combined single transaction layout schema payload tracking
                const newDocRef = await addDoc(collection(db, "appointments"), {
                    service_type: service,
                    patient_name: name,
                    patient_phone: phone,
                    appointment_date: date,
                    appointment_time: time, // Send purely as 24-hr layout securely matching admin dashboard
                    status: "Booked",
                    entry_source: "online",
                    createdAt: new Date(),
                    whatsapp_sent: false, // picked up by the WhatsApp notifier bot
                    // Placeholders prevent structural query errors on admin data loops
                    payment: "",
                    payment_type: "",
                    reference: "",
                    follow_up: ""
                });

                // Join the shared, time-ordered token queue for this service+date.
                const dayEntries = await reassignDailyTokens(db, service, date);
                const mine = dayEntries.find(e => e.id === newDocRef.id);
                const tokenNumber = mine ? mine.token_number : '';
                const aheadCount = mine ? countStillWaitingAhead(dayEntries, newDocRef.id) : '';

                const params = new URLSearchParams({
                    name: name,
                    date: date,
                    time: formatTo12Hour(time), // Format for nice display on the confirmation page
                    service: service,
                    token: tokenNumber,
                    ahead: aheadCount
                });
                window.location.href = `confirmation.html?${params.toString()}`;
            } catch (error) {
                console.error("Error writing to cloud database: ", error);
                alert("Something went wrong. Please try again.");
            }
        });
    </script>
</body>
</html>
